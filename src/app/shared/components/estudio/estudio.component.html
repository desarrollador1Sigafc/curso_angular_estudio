<!--
En Angular, los pipes son una característica que permite transformar valores en las plantillas HTML antes de que se muestren al usuario. Son útiles para formatear datos como fechas, números, monedas, textos, etc., de forma limpia y reutilizable.
-->
<p class="text-blue-600 font-bold"  >{{today | date:'fullDate'}}</p>
<strong >{{"21000" | currency :'USD'}}</strong>

<small class="block text-blue-500 text-4xl"> {{'alRevez' | reversed}}</small>


<div class="bg-gray-600 p-4 w-50 rounded-md text-white">
    <p class="text-center">
        {{nombreMasContador()}}
    </p>

    <p class="text-2xl font-bold text-center">
    
        {{contadorLectura() | percent}}
    </p>
    

    <div class="flex flex-col gap-2">
        <button (click)="increment()" class="bg-amber-700 p-1 rounded-2xl">Incrementar</button>
        <button (click)="decrement()" class="bg-amber-700 p-1 rounded-2xl">Decrementar</button>
    </div>
    
</div>

    

<div class="bg-gray-600 p-4 w-50 rounded-md text-white mt-2">
    <p class="text-center">
        {{estado() | uppercase}}
    </p>

    <button (click)="cambiarEstado()" class="bg-amber-700 p-1 rounded-2xl">cambiar estado</button>    
</div>


<div class="mt-5">
    <p>nombre es : {{user.getUser()}}</p>
    <input type="text" (keyup)="changeUserName($event)" placeholder="escribe tu nombre" class="p-2 rounded-md border-2 border-gray-500" />
</div>
